<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Teams Curriculum: Blue, Red, Purple</title>
<style>
  :root{
    --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6a63; --card:#ffffff; --line:#e4e2da;
    --accent:#3b3a8f; --accent-soft:#ecebf8; --ok:#2f7d4f; --chip:#efede5;
    --on-team:#fff; --blue:#2b6cb0; --blue-bg:#eef4fc; --red:#b83232; --red-bg:#fcefee; --purple:#7a4fb0; --purple-bg:#f4eefb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161614; --fg:#ecebe5; --muted:#a09f96; --card:#1f1f1c; --line:#33322d;
      --accent:#a9a7f0; --accent-soft:#25243a; --ok:#5cc489; --chip:#2a2a26;
      --on-team:#161614; --blue:#6aa6e8; --blue-bg:#172231; --red:#ee7d7d; --red-bg:#2e1a1a; --purple:#bb95ea; --purple-bg:#251d31; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:32px 16px 80px}
  h1{font-size:2rem;margin:0 0 6px;letter-spacing:-.02em}
  h2{font-size:1.35rem;margin:44px 0 12px;letter-spacing:-.01em}
  h3{font-size:1rem;margin:18px 0 6px}
  p{margin:8px 0}
  a{color:var(--accent)}
  .sub{color:var(--muted);max-width:72ch}
  .nav{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;margin-bottom:14px}
  .note{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;margin:16px 0;font-size:.94rem}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin:20px 0 0}
  .progress{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
  .barrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:.9rem;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:99px;padding:3px 11px;font-size:.82rem;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.88rem;padding:0;text-decoration:underline}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--chip);font-weight:600}
  tr:last-child td{border-bottom:none}
  .map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .map a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);text-decoration:none}
  .map a:hover{border-color:var(--accent)}
  .map b{display:block;font-size:.92rem}
  .map small{color:var(--muted);display:block;margin:2px 0 8px}
  .mini{height:4px;background:var(--chip);border-radius:9px;overflow:hidden}
  .mini>i{display:block;height:100%;background:var(--ok);width:0}
  .phase{margin-top:36px;scroll-margin-top:110px}
  .phase>h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .phase .tag{font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:99px}
  details.proj{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden;scroll-margin-top:110px}
  details.proj>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
  details.proj>summary::-webkit-details-marker{display:none}
  .ptitle{font-weight:650;font-size:1.05rem}
  .pmeta{color:var(--muted);font-size:.85rem;grid-column:1/2}
  .pstat{font-size:.82rem;color:var(--muted);grid-row:1/3;grid-column:2/3;text-align:right;white-space:nowrap}
  .tags{display:inline-flex;gap:5px;margin-left:6px;vertical-align:middle;flex-wrap:wrap}
  .tg{font-size:.72rem;font-weight:600;background:var(--chip);border-radius:5px;padding:1px 7px;color:var(--fg)}
  .body{padding:2px 18px 18px;border-top:1px solid var(--line)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
  @media (max-width:720px){.cols{grid-template-columns:1fr}}
  ul.plain{margin:6px 0;padding-left:20px}
  ul.plain li{margin:3px 0}
  .fw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .fw span{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
  .fw span b{color:var(--accent);font-weight:650;margin-right:4px}
  .ms{margin-top:14px}
  .ms h4{margin:0 0 4px;font-size:.92rem}
  label.chk{display:flex;gap:9px;align-items:flex-start;padding:3px 0;cursor:pointer}
  label.chk input{margin-top:5px;accent-color:var(--ok)}
  label.chk.done span{color:var(--muted);text-decoration:line-through}
  ul.refs{list-style:none;margin:6px 0;padding:0}
  ul.refs li{display:flex;gap:9px;align-items:baseline;padding:3px 0;font-size:.92rem}
  ul.refs a{color:var(--fg);text-decoration-color:var(--line);text-underline-offset:3px}
  ul.refs a:hover{color:var(--accent);text-decoration-color:var(--accent)}
  .ra{color:var(--muted)}
  .rk{flex:none;width:44px;text-align:center;font-size:.68rem;font-weight:650;border-radius:5px;padding:1px 0;background:var(--chip);color:var(--muted)}
  .rk-book{background:var(--accent-soft);color:var(--accent)}
  .done-box{margin-top:14px;padding:10px 12px;background:var(--accent-soft);border-radius:8px;font-size:.92rem}
  details.t-blue{background:var(--blue-bg);border-color:color-mix(in srgb,var(--blue) 35%,transparent);border-left:5px solid var(--blue)}
  details.t-red{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 35%,transparent);border-left:5px solid var(--red)}
  details.t-purple{background:var(--purple-bg);border-color:color-mix(in srgb,var(--purple) 35%,transparent);border-left:5px solid var(--purple)}
  details.proj .body{border-top-color:color-mix(in srgb,var(--fg) 10%,transparent)}
  .team{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:1px 7px;margin-right:8px;color:var(--on-team);vertical-align:middle}
  .team.blue{background:var(--blue)}.team.red{background:var(--red)}.team.purple{background:var(--purple)}
  .chip.tb.on,.chip.tr.on,.chip.tp.on{color:var(--on-team)}
  .map a.dim{opacity:.4}
  .chip.tb.on{background:var(--blue);border-color:var(--blue)}.chip.tr.on{background:var(--red);border-color:var(--red)}.chip.tp.on{background:var(--purple);border-color:var(--purple)}
  .chip.tb{background:var(--blue-bg)}.chip.tr{background:var(--red-bg)}.chip.tp{background:var(--purple-bg)}
  ul.xl{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:5px}
  ul.xl a{display:inline-flex;align-items:center;gap:0;color:var(--fg);text-decoration:none;font-size:.92rem}
  ul.xl a:hover span:last-child{text-decoration:underline}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;margin:10px 0}
  .legend>span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
  .tcount{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tcount span{font-size:.7rem;border-radius:4px;padding:0 6px}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .hidden{display:none!important}
  footer{margin-top:50px;color:var(--muted);font-size:.85rem}
  @media print{.bar{position:static}details.proj{break-inside:avoid}.chips,button{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav" id="nav"></div>
  <h1 id="h1"></h1>
  <p class="sub" id="intro"></p>
  <div id="pre"></div>

  <div class="bar">
    <div class="progress" aria-label="Overall progress"><i id="overallBar"></i></div>
    <div class="barrow">
      <span id="overallText">0 / 0</span>
      <span class="chips chiprow" id="teamChips"></span>
      <span class="chips chiprow" id="chips"></span>
      <button class="link" id="expand">Expand all</button>
      <button class="link" id="collapse">Collapse all</button>
      <button class="link" id="reset">Reset progress</button>
    </div>
  </div>

  <h2>Map</h2>
  <div class="map" id="map"></div>

  <div id="phases"></div>
  <div id="post"></div>
  <footer id="foot"></footer>
</div>
<script>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = CONFIG.labels;
const TEAMS = {blue:"Blue", red:"Red", purple:"Purple"};
const teamOf = p => ({b:"blue", r:"red", p:"purple"})[p.id[0]];
ITEMS.forEach(p => { p.team = teamOf(p); p.links = p.links || []; });
const BYID = Object.fromEntries(ITEMS.map(p => [p.id, p]));
// make every link two-way
ITEMS.forEach(p => p.links.forEach(id => { const q = BYID[id]; if(q && !q.links.includes(p.id)) q.links.push(p.id); }));
ITEMS.forEach(p => p.links = p.links.filter(id => BYID[id] && id !== p.id).sort((a, b) => ITEMS.indexOf(BYID[a]) - ITEMS.indexOf(BYID[b])));

let state = {};
try { state = JSON.parse(localStorage.getItem(CONFIG.key) || "{}"); } catch(e){ state = {}; }
function save(){ try { localStorage.setItem(CONFIG.key, JSON.stringify(state)); } catch(e){} }
const ul = a => `<ul class="plain">${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
const itemIds = p => p.checks.flatMap((m, mi) => m.items.map((_, ii) => p.id + "." + mi + "." + ii));
const allTags = [...new Set(ITEMS.flatMap(p => p.tags))].sort();
let activeTag = null, activeTeam = null;
try { activeTeam = localStorage.getItem(CONFIG.key + ".team") || null; } catch(e){}

document.title = CONFIG.title;
document.getElementById("h1").textContent = CONFIG.h1;
document.getElementById("intro").innerHTML = CONFIG.intro;
document.getElementById("pre").innerHTML = CONFIG.pre || "";
document.getElementById("post").innerHTML = CONFIG.post || "";
document.getElementById("foot").innerHTML = CONFIG.foot || "";
document.getElementById("nav").innerHTML = CONFIG.nav.map(([t, u]) => `<a href="${u}">${esc(t)}</a>`).join("");

function render(){
  const host = document.getElementById("phases");
  host.innerHTML = "";
  PHASES.forEach(ph => {
    const sec = document.createElement("section");
    sec.className = "phase"; sec.id = ph.id;
    sec.innerHTML = `<h2>${esc(ph.name)} <span class="tag">${esc(ph.tag)}</span></h2><p class="sub">${esc(ph.goal)}</p>`;
    ITEMS.filter(p => p.phase === ph.id).forEach(p => {
      const d = document.createElement("details");
      d.className = "proj t-" + p.team; d.id = p.id; d.dataset.tags = p.tags.join("|"); d.dataset.team = p.team;
      let h = `<summary><div class="ptitle"><span class="team ${p.team}">${TEAMS[p.team]}</span>${esc(p.title)}<span class="tags">${p.tags.map(t => `<span class="tg">${esc(t)}</span>`).join("")}</span></div>
        <div class="pmeta">${esc(p.time)}</div><div class="pstat" id="stat-${p.id}"></div></summary><div class="body">
        <p>${esc(p.summary)}</p>`;
      if(p.fw && p.fw.length) h += `<h3>Framework mapping</h3><div class="fw">${p.fw.map(([k, v]) => `<span><b>${esc(k)}</b>${esc(v)}</span>`).join("")}</div>`;
      h += `<div class="cols"><div><h3>${L.a}</h3>${ul(p.a)}</div><div><h3>${L.b}</h3>${ul(p.b)}</div></div><h3>${L.checks}</h3>`;
      p.checks.forEach((m, mi) => {
        h += `<div class="ms"><h4>${esc(m.h)}</h4>` + m.items.map((it, ii) => {
          const id = p.id + "." + mi + "." + ii;
          return `<label class="chk ${state[id] ? "done" : ""}"><input type="checkbox" data-id="${id}" ${state[id] ? "checked" : ""}><span>${esc(it)}</span></label>`;
        }).join("") + `</div>`;
      });
      if(p.c && p.c.length) h += `<h3>${L.c}</h3>${ul(p.c)}`;
      if(p.links.length) h += `<h3>${L.links}</h3><ul class="xl">${p.links.map(id => { const q = BYID[id];
        return `<li><a href="#${id}"><span class="team ${q.team}">${TEAMS[q.team]}</span><span>${esc(q.title)}</span></a></li>`; }).join("")}</ul>`;
      const refs = p.refs || [];
      if(refs.length) h += `<h3>References</h3><ul class="refs">${refs.map(([k, t, a, u]) =>
        `<li><span class="rk rk-${k.toLowerCase()}">${k}</span><span>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : `<i>${esc(t)}</i>`}${a ? ` <span class="ra">· ${esc(a)}</span>` : ""}</span></li>`).join("")}</ul>`;
      h += `<div class="done-box"><b>${L.done}</b> ${esc(p.done)}</div></div>`;
      d.innerHTML = h;
      sec.appendChild(d);
    });
    host.appendChild(sec);
  });
  document.getElementById("map").innerHTML = PHASES.map(ph => {
    const n = t => ITEMS.filter(p => p.phase === ph.id && p.team === t).length;
    return `<a href="#${ph.id}" data-phase="${ph.id}"><b>${esc(ph.name)}</b><small>${esc(ph.time)}</small><div class="mini"><i id="mini-${ph.id}"></i></div>
      <div class="tcount">${Object.keys(TEAMS).filter(n).map(t => `<span class="team ${t}">${n(t)} ${TEAMS[t]}</span>`).join("")}</div></a>`; }).join("");
  updateStats(); applyFilter();
}
document.getElementById("phases").addEventListener("change", e => {
  const cb = e.target.closest("input[type=checkbox]");
  if(!cb) return;
  state[cb.dataset.id] = cb.checked;
  cb.closest("label").classList.toggle("done", cb.checked);
  save(); updateStats();
});
const visible = p => (!activeTeam || p.team === activeTeam) && (!activeTag || p.tags.includes(activeTag));

function updateStats(){
  let total = 0, done = 0; const per = {};
  ITEMS.forEach(p => {
    const ids = itemIds(p), n = ids.filter(i => state[i]).length;
    const el = document.getElementById("stat-" + p.id);
    if(el) el.textContent = n + " / " + ids.length;
    if(!visible(p)) return;
    total += ids.length; done += n;
    per[p.phase] = per[p.phase] || [0, 0]; per[p.phase][0] += n; per[p.phase][1] += ids.length;
  });
  PHASES.forEach(ph => { const el = document.getElementById("mini-" + ph.id), v = per[ph.id] || [0, 1];
    if(el) el.style.width = (v[1] ? 100 * v[0] / v[1] : 0) + "%"; });
  document.getElementById("overallBar").style.width = (total ? 100 * done / total : 0) + "%";
  document.getElementById("overallText").textContent = done + " / " + total + " " + L.unit + (activeTeam ? " (" + TEAMS[activeTeam] + " team)" : "");
}

function applyFilter(){
  document.querySelectorAll("details.proj").forEach(d => d.classList.toggle("hidden", !visible(BYID[d.id])));
  document.querySelectorAll("section.phase").forEach(s =>
    s.classList.toggle("hidden", !s.querySelector("details.proj:not(.hidden)")));
  document.querySelectorAll("#map a").forEach(a => a.classList.toggle("dim", !ITEMS.some(p => p.phase === a.dataset.phase && visible(p))));
  document.querySelectorAll("#chips .chip").forEach(c => c.classList.toggle("on", c.dataset.t === (activeTag || "")));
  document.querySelectorAll("#teamChips .chip").forEach(c => c.classList.toggle("on", c.dataset.t === (activeTeam || "")));
  try { localStorage.setItem(CONFIG.key + ".team", activeTeam || ""); } catch(e){}
  updateStats();
}

function chipRow(host, opts, set){
  opts.forEach(([v, label, cls]) => {
    const b = document.createElement("button");
    b.className = "chip " + (cls || ""); b.dataset.t = v; b.textContent = label;
    b.onclick = () => { set(v || null); applyFilter(); };
    host.appendChild(b);
  });
}
chipRow(document.getElementById("teamChips"), [["", "All teams"], ["blue", "Blue team", "tb"], ["red", "Red team", "tr"], ["purple", "Purple team", "tp"]], v => activeTeam = v);
chipRow(document.getElementById("chips"), [["", "All frameworks"], ...allTags.map(t => [t, t])], v => activeTag = v);
document.getElementById("expand").onclick = () => document.querySelectorAll("details.proj:not(.hidden)").forEach(d => d.open = true);
document.getElementById("collapse").onclick = () => document.querySelectorAll("details.proj").forEach(d => d.open = false);
document.getElementById("reset").onclick = () => { if(confirm("Clear all ticked milestones on this page?")){ state = {}; save(); render(); } };

function openHash(){
  const id = location.hash.slice(1), d = id && document.getElementById(id);
  if(d && d.tagName === "DETAILS"){
    if(d.classList.contains("hidden")){ activeTeam = null; activeTag = null; applyFilter(); }
    d.open = true; d.scrollIntoView({ block:"start" });
  }
}
render();
window.addEventListener("hashchange", openHash);
openHash();
</script>
</body>
</html>
